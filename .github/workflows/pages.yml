# Publishes /site to branch gh-pages. In repo Settings → Pages, choose "Deploy from a branch": gh-pages / (root).
# Avoids configure-pages/deploy-pages (API 404 / environment approvals on some accounts).
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
